# Optimized Alacritty config for versions that still read YAML (before 0.13).
# Alacritty 0.13 and later ignores this file and loads alacritty.toml instead.
# Original file: alacritty.yml.bak
# Palette: Baskerville FarSide (ArcoLinux).

window:
  opacity: 0.8

scrolling:
  history: 50000

font:
  size: 11.0
  builtin_box_drawing: true
  normal:
    family: hack
    style: Regular
  bold:
    family: hack
    style: Bold
  italic:
    family: hack
    style: Italic
  bold_italic:
    family: hack
    style: Bold Italic

cursor:
  style:
    shape: Block
    blinking: Never

mouse:
  hide_when_typing: true

colors:
  primary:
    background: "#000000"
    foreground: "#919191"
  cursor:
    text: "#000000"
    cursor: "#919191"
  normal:
    black: "#303030"
    red: "#a43261"
    green: "#006ca5"
    yellow: "#007086"
    blue: "#6751a6"
    magenta: "#913e88"
    cyan: "#0061b1"
    white: "#c6c6c6"
  bright:
    black: "#5e5e5e"
    red: "#ff9fc9"
    green: "#3bd6ff"
    yellow: "#00ddf4"
    blue: "#d5b8ff"
    magenta: "#ffa7f6"
    cyan: "#93c9ff"
    white: "#ffffff"

key_bindings:
  - { key: F11, action: ToggleFullscreen }
